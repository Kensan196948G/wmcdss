# WMCDSS 共通セキュリティレスポンスヘッダー。
#
# このファイルは `/etc/nginx/conf.d/` の**外**へ配置する。conf.d 配下は
# nginx 既定の `include /etc/nginx/conf.d/*.conf;` によって http コンテキストで
# 自動読み込みされるため、そこへ置くと明示 include と二重に評価されてしまう。
#
# 使い方: add_header を持つ全ての server / location ブロックで include する。
# nginx は「現在のレベルに add_header が 1 つでもあれば上位を継承しない」ため、
# 独自の add_header を持つ location では必ずこれも並べる必要がある。
#   https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
#
# `always` を付けているのは、4xx/5xx のエラーレスポンスにもヘッダーを付ける
# ため。付けないと 2xx/3xx などの成功系にしか適用されず、攻撃者が最も多く
# 観測するエラー応答が無防備になる。
#
# Content-Security-Policy — 2026-08 導入。
#
# 許可する外部オリジンは以下の通り（各利用箇所とセットで保守する）:
#   script-src  https://unpkg.com         → index.html の Leaflet JS
#   style-src   https://unpkg.com         → index.html の Leaflet CSS
#               https://fonts.googleapis.com  → styles.css @import (Noto Sans JP)
#               'unsafe-inline'           → React のインライン style（JSX 経由）
#   font-src    https://fonts.gstatic.com → Google Fonts のフォントファイル実体
#   img-src     https://*.tile.openstreetmap.org → Leaflet 地図タイル (dashboard.tsx)
#               data:                     → Leaflet が内部利用する data: URI
#               blob:                     → 将来の動的画像生成に備える
#
# 再検討条件:
#   - 新たに外部 CDN / API を参照するコンポーネントを追加した場合
#   - TLS 導入時に upgrade-insecure-requests を追加する (要検討: 既存HTTP運用では
#     リダイレクトループや混在コンテンツブロックのリスクがある)
#   - ブラウザコンソールに CSP 違反レポートが出た場合（Report-Only で検出推奨）
#
# 検証手順:
#   1. `docker compose up --build -d` でコンテナを起動
#   2. ブラウザ DevTools → Network タブで CSP ヘッダーが全レスポンスに付与されていることを確認
#   3. ダッシュボード画面で Leaflet 地図タイルが正常表示されることを確認
#   4. 画面全体のフォントが Noto Sans JP でレンダリングされていることを確認
#   5. DevTools → Console に CSP violation が出力されていないことを確認
#   6. 各主要画面（現場一覧、気象データ、しきい値管理など）を巡回し表示崩れがないことを確認
#
# upgrade-insecure-requests は**意図的に含めない**。現在の配信は平文 HTTP であり、
# このディレクティブを有効にすると全リソース参照が HTTPS に書き換えられ、
# HTTP 専用の内部 API 呼び出しが失敗する。TLS 導入後に追加する。
#   → 追加時: add_header Content-Security-Policy "...; upgrade-insecure-requests" always;
#
# Strict-Transport-Security も含めない。現在の配信は平文 HTTP であり、
# TLS 終端のない状態で HSTS を名乗るのは実態と異なる。
#
# 注: add_header の値は nginx では1行でなければならない。改行を含めると
# ヘッダー値がバックスラッシュに置換されてしまう (検証済み: nginx 1.27)。

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
