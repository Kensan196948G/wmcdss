# Defer upstream DNS resolution to request time so the image starts even when
# `backend` isn't reachable (CI standalone `docker run`, local docs builds).
# Inside compose, Docker's embedded DNS at 127.0.0.11 answers; outside compose
# the proxy locations will 502 on use but nginx itself comes up clean.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;

  # ---------------------------------------------------------------------------
  # セキュリティヘッダー
  #
  # 重要: nginx の add_header は「現在のレベルに add_header が 1 つでもあれば、
  # 上位レベルの add_header を一切継承しない」という仕様である
  # (https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header)。
  # そのため server レベルにだけ書くと、独自の add_header を持つ location
  # (下の /assets/ と / ) では全て消える。実際 SPA 本体を返す `location /` は
  # Cache-Control を持っていたため、index.html にセキュリティヘッダーが
  # 1 つも付いていなかった。
  #
  # 対策として共通集合を include ファイルへ切り出し、add_header を持つ
  # 各 location で明示的に読み込む。追加時は security-headers.conf だけを
  # 直せばよく、location ごとの取りこぼしが起きない。
  # ---------------------------------------------------------------------------
  include /etc/nginx/security-headers.conf;

  # Gzip — static text assets only.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    image/svg+xml;

  # Vite content-hashed assets — long cache.
  # `expires 1y` は使わない。expires ディレクティブ自身が
  # `Cache-Control: max-age=31536000` を出力するため、下の add_header と合わせて
  # Cache-Control が 2 本になる。RFC 9111 §5.2 は複数フィールドをカンマ結合として
  # 扱うので最終的な解釈は正しくなるが、中継プロキシの実装差が出る箇所を
  # わざわざ作る意味がない。max-age を add_header 側へ畳んで 1 本にする。
  # (expires が併せて出す Expires: ヘッダーは HTTP/1.0 互換用で、
  #  RFC 9111 §5.3 により max-age がある場合は無視される。)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Backend reverse proxy — pass /api/ to backend as-is.
  location /api/ {
    set $backend_upstream "backend:8000";
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Backend healthz passthrough.
  location = /readyz {
    set $backend_upstream "backend:8000";
    proxy_pass http://$backend_upstream;
  }

  location = /healthz {
    set $backend_upstream "backend:8000";
    proxy_pass http://$backend_upstream;
  }

  location = /docs {
    return 404;
  }

  location = /redoc {
    return 404;
  }

  location = /openapi.json {
    return 404;
  }

  location = /metrics {
    return 404;
  }

  # SPA fallback — physical file → directory → index.html.
  location / {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
