# Defer upstream DNS resolution to request time so the image starts even when
# `backend` isn't reachable (CI standalone `docker run`, local docs builds).
# Inside compose, Docker's embedded DNS at 127.0.0.11 answers; outside compose
# the proxy locations will 502 on use but nginx itself comes up clean.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip — static text assets only.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    image/svg+xml;

  # Vite content-hashed assets — long cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Backend reverse proxy — pass /api/ to backend as-is.
  location /api/ {
    set $backend_upstream "backend:8000";
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Backend healthz passthrough.
  location = /readyz {
    set $backend_upstream "backend:8000";
    proxy_pass http://$backend_upstream;
  }

  # SPA fallback — physical file → directory → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
