<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>気象海象判断支援システム</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="api.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script type="text/babel" src="site-pages.jsx"></script>
  <script type="text/babel" src="weather-marine.jsx"></script>
  <script type="text/babel" src="decisions.jsx"></script>
  <script type="text/babel" src="admin-pages.jsx"></script>
  <script type="text/babel" src="analysis.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "normal"
    }/*EDITMODE-END*/;

    const Root = () => {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const backend = window.BACKEND_STATUS || { ok: false, reason: 'pending' };

      return (
        <>
          <App density={t.density} />
          <TweaksPanel title="表示設定">
            <TweakSection label="レイアウト">
              <TweakRadio label="情報密度" value={t.density}
                options={[
                  { value: 'normal', label: 'ゆったり' },
                  { value: 'compact', label: 'コンパクト' },
                ]}
                onChange={(v) => setTweak('density', v)} />
            </TweakSection>
            <TweakSection label="データソース">
              <div style={{ fontSize: '12px', lineHeight: 1.5 }}>
                {backend.ok
                  ? <span style={{ color: '#16a34a' }}>● Live API: {backend.sites} sites</span>
                  : <span style={{ color: '#ca8a04' }}>● Mock data ({backend.reason || 'offline'})</span>}
                <div style={{ color: '#6b7280', marginTop: 2 }}>{window.WMCDSS_API_BASE}</div>
              </div>
            </TweakSection>
          </TweaksPanel>
        </>
      );
    };

    // Babel Standalone executes each `text/babel` block as a separate IIFE in load order,
    // so by the time this block runs, api.jsx has defined window.WMCDSS_API. We still
    // await initFromBackend() before first render so window.SITES contains live data.
    (async () => {
      try { await window.WMCDSS_API.initFromBackend(); }
      catch (e) { console.warn('[wmcdss] init failed:', e); }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Root />);
    })();
  </script>
</body>
</html>
