name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    name: backend / pure-function tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run pure-function tests
        # test_api_smoke.py requires a running docker-compose stack and is
        # covered by the backend-smoke job below.
        run: pytest -v --ignore=tests/test_api_smoke.py

  backend-smoke:
    name: backend / api smoke (live compose)
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v7

      - name: Bring up compose stack
        # --wait blocks until healthcheck'd services are healthy; backend has
        # no healthcheck so the readyz poll below covers its warm-up window.
        run: docker compose up -d --wait db backend

      - name: Wait for backend /readyz
        # Backend cold start = pip install + uvicorn boot. Empirically 30-60s
        # on GH runners; cap at 90s and dump logs on timeout.
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8003/readyz >/dev/null; then
              echo "backend ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready in 90s"
          docker compose logs backend
          exit 1

      - name: Install dev extras inside backend container
        # compose's startup command installs the package without dev extras
        # (matches production image semantics). Smoke needs pytest+httpx, so
        # we layer them on after the container is up.
        run: docker compose exec -T backend pip install --quiet -e ".[dev]"

      - name: Run smoke tests against compose network
        run: |
          docker compose exec -T \
            -e WMCDSS_TEST_BASE=http://backend:8000 \
            backend pytest -v tests/test_api_smoke.py

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-unit:
    name: frontend / vitest (pure-function)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vite-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/vite-app/package-lock.json

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Run vitest
        run: npm test

  frontend-build:
    name: frontend / vite build (scaffold)
    runs-on: ubuntu-latest
    needs: frontend-unit
    defaults:
      run:
        working-directory: frontend/vite-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/vite-app/package-lock.json

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "::group::dist/ contents"
          ls -lah dist
          echo "::endgroup::"
          echo "::group::asset sizes"
          du -sh dist/assets/* 2>/dev/null || true
          echo "::endgroup::"

  frontend-image:
    name: frontend / docker image build
    runs-on: ubuntu-latest
    # Independent of every other job — validates the multi-stage Dockerfile
    # (node:22-alpine build + nginx:1.27-alpine runtime) added in Loop 36.
    # Without this gate, a broken COPY/nginx.conf path would only surface
    # when someone ran `docker compose up` locally.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontend/vite-app
          file: frontend/vite-app/Dockerfile
          push: false
          load: true
          tags: wmcdss-frontend:ci
          # GHA-backed buildx cache — first run primes the npm-ci layer,
          # subsequent runs reuse it unless package-lock.json changes.
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max

      - name: Smoke-test the built image
        # Boot the image, hit / (nginx index.html) to confirm the runtime
        # stage is wired up (COPY dist + nginx.conf both valid).
        run: |
          docker run -d --name fe-ci -p 18080:80 wmcdss-frontend:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18080/ >/dev/null; then
              echo "frontend image healthy after ${i} polls"
              docker rm -f fe-ci
              exit 0
            fi
            sleep 1
          done
          echo "::error::frontend image failed to serve / within 20s"
          docker logs fe-ci
          docker rm -f fe-ci
          exit 1

  frontend-e2e:
    name: frontend / playwright e2e
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend/vite-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/vite-app/package-lock.json

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Install Playwright browsers
        # Firefox is the E2E browser; chrome-headless-shell (Playwright 1.60 /
        # build 1223) triggers SIGTRAP on Linux 6.17 kernels via seccomp filter
        # incompatibility. Firefox 150 is stable on all supported runners.
        run: npx playwright install --with-deps firefox

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/vite-app/playwright-report/
          retention-days: 7

  backend-audit:
    name: backend / dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Independent of the test pipeline — a dependency CVE should surface even
    # when tests are green. Fulfils the "dependency / security scan" minimum
    # quality gate (CLAUDE.md §11) that was previously missing.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"

      - name: Audit resolved dependencies (pip-audit)
        # Audits the resolved environment (project deps + transitive) in the
        # clean runner and fails on any known-vulnerable package. The editable
        # project itself is skipped (not on PyPI) without failing the run.
        #
        # pip is upgraded first: pip-audit audits the *whole* environment, so an
        # outdated runner pip would be flagged for its own CVEs — a tool, not a
        # project dependency — and would falsely fail the gate.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --progress-spinner=off

  frontend-audit:
    name: frontend / dependency audit (npm audit)
    runs-on: ubuntu-latest
    # Independent gate — npm advisories (e.g. the undici dev-dep bump in
    # PR for #45) must block merge at high+ severity, not just be noticed.
    defaults:
      run:
        working-directory: frontend/vite-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/vite-app/package-lock.json

      - name: Install (clean, lockfile-pinned)
        # npm ci also fails fast if package.json and the lockfile drift apart.
        run: npm ci

      - name: Audit dependencies (high+ severity fails)
        # moderate/low are reported but do not fail; high & critical block.
        run: npm audit --audit-level=high

  secret-scan:
    name: security / secret scan (gitleaks)
    runs-on: ubuntu-latest
    # 秘密値・資格情報がリポジトリへ混入した瞬間にブロックする最終ゲート。
    # .env 実体や AI settings ファイルは .gitignore 済みだが、事故混入や
    # 履歴からの漏えいはテストでは検出できないため独立ジョブで監視する。
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
