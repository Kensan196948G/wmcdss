name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    name: backend / pure-function tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run pure-function tests
        # test_api_smoke.py requires a running docker-compose stack and is
        # covered by the backend-smoke job below.
        run: pytest -v --ignore=tests/test_api_smoke.py

  backend-smoke:
    name: backend / api smoke (live compose)
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v5

      - name: Bring up compose stack
        # --wait blocks until healthcheck'd services are healthy; backend has
        # no healthcheck so the readyz poll below covers its warm-up window.
        run: docker compose up -d --wait db backend

      - name: Wait for backend /readyz
        # Backend cold start = pip install + uvicorn boot. Empirically 30-60s
        # on GH runners; cap at 90s and dump logs on timeout.
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8003/readyz >/dev/null; then
              echo "backend ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend failed to become ready in 90s"
          docker compose logs backend
          exit 1

      - name: Install dev extras inside backend container
        # compose's startup command installs the package without dev extras
        # (matches production image semantics). Smoke needs pytest+httpx, so
        # we layer them on after the container is up.
        run: docker compose exec -T backend pip install --quiet -e ".[dev]"

      - name: Run smoke tests against compose network
        run: |
          docker compose exec -T \
            -e WMCDSS_TEST_BASE=http://backend:8000 \
            backend pytest -v tests/test_api_smoke.py

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-build:
    name: frontend / vite build (scaffold)
    runs-on: ubuntu-latest
    # No `needs:` — frontend toolchain is independent of backend tests, so
    # this job runs in parallel and shortens the critical path. It will be
    # promoted to required-status once Phase 1 ports real .jsx modules.
    defaults:
      run:
        working-directory: frontend/vite-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          # setup-node hashes the lockfile to compute the cache key, so it
          # must point at the file we actually use for installs.
          cache-dependency-path: frontend/vite-app/package-lock.json

      - name: Install (clean, lockfile-pinned)
        # `npm ci` refuses to mutate the lockfile — exactly what we want in
        # CI so a stray dependency drift fails loudly instead of silently
        # producing a different bundle than the developer just tested.
        run: npm ci

      - name: Build
        run: npm run build

      - name: Report bundle size
        # Surface bundle bytes in the job log so size regressions are easy
        # to spot in PR diffs. Phase 1 may turn this into an artifact upload.
        run: |
          echo "::group::dist/ contents"
          ls -lah dist
          echo "::endgroup::"
          echo "::group::asset sizes"
          du -sh dist/assets/* 2>/dev/null || true
          echo "::endgroup::"
