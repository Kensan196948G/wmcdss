services:
  db:
    image: postgres:16-alpine
    container_name: wmcdss-db
    environment:
      POSTGRES_USER: wmcdss
      POSTGRES_PASSWORD: wmcdss
      POSTGRES_DB: wmcdss
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - wmcdss_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmcdss -d wmcdss"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wmcdss-backend:dev
    container_name: wmcdss-backend
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      WMCDSS_DATABASE_URL: postgresql+asyncpg://wmcdss:wmcdss@db:5432/wmcdss
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
    volumes:
      # Live source mount keeps `--reload` working for app code edits.
      # Image install of deps still owns pyproject.toml resolution.
      - ./backend:/app
    ports:
      - "0.0.0.0:8003:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import http.client,sys; c=http.client.HTTPConnection("localhost",8000,timeout=2); c.request("GET","/readyz"); sys.exit(0 if c.getresponse().status==200 else 1)''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/vite-app
      dockerfile: Dockerfile
    container_name: wmcdss-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:80"
    restart: unless-stopped

volumes:
  wmcdss_pgdata:
