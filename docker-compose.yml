services:
  db:
    image: postgres:16-alpine
    container_name: wmcdss-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wmcdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wmcdss}
      POSTGRES_DB: ${POSTGRES_DB:-wmcdss}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - wmcdss_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wmcdss} -d ${POSTGRES_DB:-wmcdss}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wmcdss-backend:dev
    container_name: wmcdss-backend
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- Database ---
      WMCDSS_DATABASE_URL: ${WMCDSS_DATABASE_URL:-postgresql+asyncpg://wmcdss:wmcdss@db:5432/wmcdss}
      # --- App ---
      WMCDSS_DEBUG: ${WMCDSS_DEBUG:-false}
      WMCDSS_EXPOSE_OPENAPI: ${WMCDSS_EXPOSE_OPENAPI:-false}
      # --- CORS (Windows ホスト IP:9080 を含む) ---
      WMCDSS_CORS_ORIGINS: ${WMCDSS_CORS_ORIGINS:-http://172.23.10.251:9080,http://localhost:9080,http://127.0.0.1:9080}
      # --- JWT 認証 ---
      WMCDSS_JWT_SECRET: ${WMCDSS_JWT_SECRET:-dev-secret-please-change-in-production}
      WMCDSS_JWT_EXPIRE_MINUTES: ${WMCDSS_JWT_EXPIRE_MINUTES:-480}
      # --- ローカルユーザー (一般ログイン) ---
      WMCDSS_LOCAL_USERS: ${WMCDSS_LOCAL_USERS:-admin:$2b$12$dev_hash_placeholder}
      # --- Microsoft 365 / Entra ID (非対話式認証 ROPC) ---
      WMCDSS_ENTRA_TENANT_ID: ${WMCDSS_ENTRA_TENANT_ID:-}
      WMCDSS_ENTRA_CLIENT_ID: ${WMCDSS_ENTRA_CLIENT_ID:-}
      WMCDSS_ENTRA_CLIENT_SECRET: ${WMCDSS_ENTRA_CLIENT_SECRET:-}
      WMCDSS_ENTRA_AUTHORITY: ${WMCDSS_ENTRA_AUTHORITY:-}
      WMCDSS_ENTRA_SCOPE: ${WMCDSS_ENTRA_SCOPE:-https://graph.microsoft.com/User.Read}
      WMCDSS_ENTRA_EMAIL_DOMAIN: ${WMCDSS_ENTRA_EMAIL_DOMAIN:-mirai-const.co.jp}
      # --- 既存 API キー (管理 API 用) ---
      WMCDSS_API_KEYS: ${WMCDSS_API_KEYS:-}
      WMCDSS_RATE_LIMIT_PER_MINUTE: ${WMCDSS_RATE_LIMIT_PER_MINUTE:-60}
      # --- JMA ---
      WMCDSS_JMA_USER_AGENT: ${WMCDSS_JMA_USER_AGENT:-wmcdss/1.0 (+contact: kensan1969@gmail.com)}
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./backend:/app
    ports:
      - "0.0.0.0:8003:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import http.client,sys; c=http.client.HTTPConnection("localhost",8000,timeout=2); c.request("GET","/readyz"); sys.exit(0 if c.getresponse().status==200 else 1)''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: always

  frontend:
    build:
      context: ./frontend/vite-app
      dockerfile: Dockerfile
    container_name: wmcdss-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # ポート 9080 を使用 (8080 は既存サービスと競合するため)
      # WebUI アクセス URL: http://172.23.10.251:9080
      - "0.0.0.0:9080:80"
    restart: always

volumes:
  wmcdss_pgdata:
