services:
  db:
    image: postgres:16-alpine
    container_name: wmcdss-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wmcdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wmcdss}
      POSTGRES_DB: ${POSTGRES_DB:-wmcdss}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - wmcdss_pgdata:/var/lib/postgresql/data
      # db/migrations は /docker-entrypoint-initdb.d へマウントしない。
      # postgres 公式 entrypoint は $PGDATA/PG_VERSION があると初期化を丸ごと
      # 飛ばすため、初回以降に追加した migration が二度と適用されない。
      # 適用は db-migrate サービス（app/db/migrate.py）へ一本化する。
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wmcdss} -d ${POSTGRES_DB:-wmcdss}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  # スキーマ適用専用のワンショット。backend より先に必ず完走させる。
  # イメージは backend サービスのビルドで作られる（weather-ingest 等と同じ流儀）。
  db-migrate:
    image: wmcdss-backend:dev
    container_name: wmcdss-db-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      WMCDSS_DATABASE_URL: "${WMCDSS_DATABASE_URL:-postgresql+asyncpg://wmcdss:wmcdss@db:5432/wmcdss}"
      WMCDSS_MIGRATIONS_DIR: /migrations
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      # /app の外へマウントする。backend が ./backend:/app を bind mount して
      # いるため配下へネストさせるとホスト側に空ディレクトリが作られる。
      - ./db/migrations:/migrations:ro
    command: ["python", "-m", "app.db.migrate", "up"]
    # ワンショットなので再起動しない。失敗したら backend も起動しない
    # （backend の depends_on が service_completed_successfully のため）。
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: wmcdss-backend:dev
    container_name: wmcdss-backend
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      # スキーマ未適用のまま API を公開しない。migrate が失敗すれば backend は
      # 起動せず、「デプロイは成功したのにスキーマが古い」状態を作らない。
      db-migrate:
        condition: service_completed_successfully
    environment:
      # --- Database ---
      WMCDSS_DATABASE_URL: "${WMCDSS_DATABASE_URL:-postgresql+asyncpg://wmcdss:wmcdss@db:5432/wmcdss}"
      # --- App ---
      WMCDSS_DEBUG: ${WMCDSS_DEBUG:-false}
      WMCDSS_EXPOSE_OPENAPI: ${WMCDSS_EXPOSE_OPENAPI:-false}
      # 開発スタックは API キーなし・既定 JWT 秘密鍵で動く。本番なら起動を
      # 拒否される構成なので、ここで明示的に検査を降格する。
      # 本番 (docker-compose.production.yml) では false に固定している。
      #
      # ※ このフラグは「起動時セキュリティ検査を降格する」だけであり、
      #   資格情報なしのリクエストを admin 相当にする効果は無い。両者は別物で、
      #   混同すると下の WMCDSS_DEV_OPEN_ACCESS の既定を誤って true にしてしまう
      #   （それが verifier F-01 の穴だった）。
      WMCDSS_ALLOW_INSECURE_DEFAULTS: "${WMCDSS_ALLOW_INSECURE_DEFAULTS:-true}"
      # 資格情報なしのリクエストを admin 相当として扱う明示 opt-in。
      # **既定は false**（fail-closed）。開発スタックでも、資格情報なしで curl して
      # 挙動を確かめたい開発者だけが `.env` に
      # `WMCDSS_DEV_OPEN_ACCESS=true` を明示する。口は残すが既定では開けない。
      #
      # 以前ここを `:-true` にしていたため、開発スタック（backend は 0.0.0.0:8003、
      # frontend は 0.0.0.0:9080 で公開）が LAN から到達可能な状態で、匿名
      # POST /api/v1/sites・POST /api/v1/thresholds・DELETE /api/v1/thresholds・
      # POST /api/v1/observations/weather が無認証で通っていた。fail-open を
      # リポジトリ側の既定値で復活させないこと。
      # 本番 (docker-compose.production.yml / .env.production.example) はこの変数を
      # 渡さない（= アプリ既定の false）。
      WMCDSS_DEV_OPEN_ACCESS: "${WMCDSS_DEV_OPEN_ACCESS:-false}"
      # --- CORS: コンマ区切り URL 文字列 (str フィールド cors_origins_raw にマップ) ---
      WMCDSS_CORS_ORIGINS_RAW: "${WMCDSS_CORS_ORIGINS_RAW:-http://${WMCDSS_WEBUI_HOST:-172.23.10.251}:${WMCDSS_WEBUI_PORT:-9080},http://localhost:${WMCDSS_WEBUI_PORT:-9080},http://127.0.0.1:${WMCDSS_WEBUI_PORT:-9080}}"
      # --- API キー: コンマ区切り文字列 (str フィールド api_keys_raw にマップ) ---
      WMCDSS_API_KEYS_RAW: "${WMCDSS_API_KEYS_RAW:-}"
      WMCDSS_RATE_LIMIT_PER_MINUTE: ${WMCDSS_RATE_LIMIT_PER_MINUTE:-60}
      # --- JWT 認証 ---
      WMCDSS_JWT_SECRET: ${WMCDSS_JWT_SECRET:-dev-secret-please-change-in-production}
      WMCDSS_JWT_EXPIRE_MINUTES: ${WMCDSS_JWT_EXPIRE_MINUTES:-480}
      # --- ローカルユーザー (一般ログイン) ---
      WMCDSS_LOCAL_USERS: "${WMCDSS_LOCAL_USERS:-}"
      # --- Microsoft 365 / Entra ID (非対話式認証 ROPC) ---
      WMCDSS_ENTRA_TENANT_ID: ${WMCDSS_ENTRA_TENANT_ID:-}
      WMCDSS_ENTRA_CLIENT_ID: ${WMCDSS_ENTRA_CLIENT_ID:-}
      WMCDSS_ENTRA_CLIENT_SECRET: ${WMCDSS_ENTRA_CLIENT_SECRET:-}
      WMCDSS_ENTRA_AUTHORITY: "${WMCDSS_ENTRA_AUTHORITY:-}"
      WMCDSS_ENTRA_SCOPE: "${WMCDSS_ENTRA_SCOPE:-https://graph.microsoft.com/User.Read}"
      WMCDSS_ENTRA_EMAIL_DOMAIN: ${WMCDSS_ENTRA_EMAIL_DOMAIN:-mirai-const.co.jp}
      # --- JMA ---
      WMCDSS_JMA_USER_AGENT: "${WMCDSS_JMA_USER_AGENT:-wmcdss/1.0 (+contact: kensan1969@gmail.com)}"
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./backend:/app
    ports:
      - "0.0.0.0:8003:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import http.client,sys; c=http.client.HTTPConnection("localhost",8000,timeout=2); c.request("GET","/readyz"); sys.exit(0 if c.getresponse().status==200 else 1)''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: always

  frontend:
    build:
      context: ./frontend/vite-app
      dockerfile: Dockerfile
    container_name: wmcdss-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # WMCDSS_WEBUI_PORT: setup-webui.sh が自動検出したポートを .env で設定
      # WebUI アクセス URL: http://<WMCDSS_WEBUI_HOST>:<WMCDSS_WEBUI_PORT>
      - "0.0.0.0:${WMCDSS_WEBUI_PORT:-9080}:80"
    restart: always

volumes:
  wmcdss_pgdata:
